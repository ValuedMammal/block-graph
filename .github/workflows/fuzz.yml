name: Fuzz

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * *" # At 03:17
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NIGHTLY: nightly-2026-07-25

jobs:
  build:
    name: Build fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: clippy, rustfmt
          # The action defaults this to `-D warnings`, which would clobber the
          # `--cfg fuzzing` RUSTFLAGS set per-step below.
          rustflags: ""
          cache-workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Clippy the `cfg(fuzzing)` path
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo clippy --all-targets --all-features -- -Dwarnings
      - name: Fmt the fuzz crate
        working-directory: fuzz
        run: cargo fmt --all -- --check
      - name: Clippy the fuzz crate
        working-directory: fuzz
        run: cargo clippy --all-targets -- -Dwarnings
      - name: Build all fuzz targets
        working-directory: fuzz
        run: cargo fuzz build

  run:
    name: Fuzz ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - from_changeset
          - connect_block
          - apply_update
          - checkpoint_ops
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.NIGHTLY }}
          rustflags: ""
          cache-workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Select run duration
        id: cfg
        env:
          DURATION_INPUT: ${{ inputs.duration }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            # Run on nightly schedule for 10 min
            schedule) secs=600 ;;
            workflow_dispatch) secs="$DURATION_INPUT" ;;
            *) secs=60 ;;
          esac
          # Reject anything non-numeric
          case "$secs" in '' | *[!0-9]*) secs=60 ;; esac
          echo "secs=$secs" >> "$GITHUB_OUTPUT"
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # Cache entries are immutable, so the save key is unique per run and
          # the prefix restore-key picks up the newest entry.
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ steps.cfg.outputs.secs }} \
            -max_len=4096 \
            -rss_limit_mb=4096 \
            -timeout=10
      - name: Minimize corpus
        if: ${{ success() && github.event_name == 'schedule' }}
        working-directory: fuzz
        run: cargo fuzz cmin ${{ matrix.target }} -- -rss_limit_mb=4096 -timeout=10
      # Only the scheduled run writes to the cache: it runs on the default branch,
      # so its entry is readable from every PR, but a PR won't poison it.
      - name: Save corpus
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
